minimumReleaseAge: 1440
saveExact: true

# pnpm >=11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with allowBuilds
# (map of package matcher -> allow/deny). See docs/adr/0013-build-toolchain.md.
allowBuilds:
  '@swc/core': true
  msgpackr-extract: true
  protobufjs: true
  '@scarf/scarf': false
  # transitive deps of testcontainers (via dockerode/docker-modem) used only for
  # optional SSH tunneling to remote Docker hosts, not used with local Docker Desktop;
  # ssh2's postinstall only builds an optional native crypto accelerator and falls
  # back to pure JS without it, so denying the build script is safe.
  cpu-features: false
  ssh2: false

# Global constraint: the whole tree has exactly one ioredis. The version lives only in the
# catalog (package.json uses "catalog:"); the override pins every transitive ioredis (bullmq,
# @node-idempotency/storage...) to it, so a dependency bump can never add a second copy.
catalog:
  ioredis: 6.0.0

overrides:
  ioredis: 'catalog:'
