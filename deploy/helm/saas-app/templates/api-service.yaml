apiVersion: v1
kind: Service
metadata:
  name: {{ include "saas-app.name" (dict "root" . "suffix" "api") }}
  labels:
    {{- include "saas-app.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "saas-app.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
