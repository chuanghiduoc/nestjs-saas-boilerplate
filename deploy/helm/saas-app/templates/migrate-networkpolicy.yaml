{{- /*
NetworkPolicy của Job migrate là hook weight -10 (có trước Job, kể cả lần cài đầu vào namespace default-deny). Chính sách
xoá before-hook-creation: policy còn lại sau upgrade, nên Job chạy tay (`-down-<ticket>`, cùng nhãn component) cũng được
phủ (spec §12.4). Chỉ DNS + Postgres trực tiếp (migration không đi qua PgBouncer) + extra.migrate; không ingress.
*/ -}}
{{- if and .Values.migrate.enabled .Values.networkPolicy.enabled }}
{{- $eg := .Values.networkPolicy.egress -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "saas-app.name" (dict "root" . "suffix" "migrate") }}
  labels:
    {{- include "saas-app.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "saas-app.selectorLabels" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- toYaml (concat $eg.dns $eg.postgres $eg.extra.migrate) | nindent 4 }}
{{- end }}
