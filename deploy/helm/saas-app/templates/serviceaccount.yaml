{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "saas-app.serviceAccountName" . }}
  labels:
    {{- include "saas-app.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# App không gọi Kubernetes API.
automountServiceAccountToken: false
{{- end }}
