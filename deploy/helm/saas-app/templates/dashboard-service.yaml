{{- /* Bull Board: ClusterIP, chỉ port-forward/nội bộ; không HTTPRoute/Ingress nào trỏ tới. */ -}}
{{- $root := . -}}
{{- range $g, $w := .Values.workers }}
{{- if $w.dashboard }}
{{- $component := printf "worker-%s" $g }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "saas-app.name" (dict "root" $root "suffix" (printf "%s-dashboard" $component)) }}
  labels:
    {{- include "saas-app.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "saas-app.selectorLabels" (dict "root" $root "component" $component) | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ $root.Values.ports.dashboard }}
      targetPort: dashboard
      protocol: TCP
{{- end }}
{{- end }}
