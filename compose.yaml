name: nestjs-saas-boilerplate

# File env (sinh bằng `pnpm env:example`):
# - docker/images.env : image pin theo digest (nội suy).
# - .env.infra        : config/secret của hạ tầng (superuser, REDIS_PASSWORD, cổng host,
#                       COMPOSE_REDIS_URL...). CHỈ dùng để nội suy, không bao giờ vào container app.
# - .env              : config của app; vào container app qua `env_file`. Postgres cũng nội suy các
#                       mật khẩu role app từ đây.
# Hạ tầng (mặc định, không có app):
#   docker compose --env-file docker/images.env --env-file .env.infra --env-file .env up -d
# Thêm 3 vai trò app (build image từ Dockerfile):
#   docker compose --env-file docker/images.env --env-file .env.infra --env-file .env --profile app up -d --build
#
# Chung cho 3 vai trò của image app (một image, khác tham số node). Profile `app`: `up -d` mặc định
# chỉ chạy hạ tầng, để `pnpm start:dev` trên host vẫn dùng được cổng 3000. Bảo mật lúc chạy giống
# spec 13.3 (read-only rootfs, /tmp là tmpfs, bỏ mọi capability, cấm leo quyền).
# Không `init: true`: node là PID 1 như trên Kubernetes (không có init), để compose chạy đúng
# đường tắt thật. installShutdown bắt SIGTERM/SIGINT nên PID 1 vẫn tắt êm; app không sinh process
# con nên không cần reaper. Cổng trong container cố định ở đây (HTTP_PORT, WORKER_HEALTH_PORT)
# để port mapping và healthcheck luôn khớp; cổng phía host lấy từ .env.infra, chỉ bind 127.0.0.1.
# Secret không cần cho vai trò nào thì bị ghi đè thành rỗng trong `environment` của vai trò đó
# (config coi rỗng là thiếu): chỉ migrate có DB_OWNER_PASSWORD, chỉ worker có DB_RELAY_PASSWORD,
# migrate không có DB_AUTH_PASSWORD (không mở pool auth_user).
x-app: &app
  image: nestjs-saas-boilerplate:local
  build:
    context: .
    args:
      BUILD_IMAGE: ${IMAGE_NODE_BUILD}
      RUNTIME_IMAGE: ${IMAGE_NODE_RUNTIME}
  # Image chỉ có ở local: luôn build (cache làm lần build lại gần như tức thì), không bao giờ pull.
  pull_policy: build
  profiles: [app]
  # Smoke (Task 17) trỏ file env riêng; dev dùng `.env`.
  env_file: ['${APP_ENV_FILE:-.env}']
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    image: ${IMAGE_POSTGRES}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      APP_USER_PASSWORD: ${DB_APP_PASSWORD}
      APP_RELAY_PASSWORD: ${DB_RELAY_PASSWORD}
      APP_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      APP_USER_STATEMENT_TIMEOUT_MS: ${DB_APP_STATEMENT_TIMEOUT_MS}
      APP_RELAY_STATEMENT_TIMEOUT_MS: ${DB_RELAY_STATEMENT_TIMEOUT_MS}
      AUTH_USER_STATEMENT_TIMEOUT_MS: ${DB_AUTH_STATEMENT_TIMEOUT_MS}
      IDLE_IN_TX_TIMEOUT_MS: ${DB_IDLE_IN_TX_TIMEOUT_MS}
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    ports: ['127.0.0.1:${DB_PORT_HOST}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 20
  redis:
    image: ${IMAGE_REDIS}
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['127.0.0.1:${REDIS_PORT_HOST}:6379']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping']
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  pgbouncer:
    image: ${IMAGE_PGBOUNCER}
    # Bọc entrypoint gốc để thêm auth_user vào userlist (docker/pgbouncer/entrypoint.sh).
    entrypoint: ['/bin/sh', '/sp2-entrypoint.sh']
    command: ['/usr/bin/pgbouncer', '/etc/pgbouncer/pgbouncer.ini']
    volumes: ['./docker/pgbouncer/entrypoint.sh:/sp2-entrypoint.sh:ro']
    depends_on: { postgres: { condition: service_healthy } }
    ports: ['127.0.0.1:${PGBOUNCER_PORT_HOST}:5432']
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME}
      DB_USER: app_user
      DB_PASSWORD: ${DB_APP_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      AUTH_DB_PASSWORD: ${DB_AUTH_PASSWORD}
      # Bắt buộc > 0 (spike S2b, ADR 0010): RateLimiterPostgres dùng named prepared statement.
      MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS}
  mailpit:
    image: ${IMAGE_MAILPIT}
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT_HOST}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT_HOST}:8025'
  migrate:
    <<: *app
    command: ['dist/main.migrate.js', 'up']
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      # Ruling R8: migration đi thẳng Postgres, không qua PgBouncer.
      DB_MIGRATION_HOST: postgres
      DB_MIGRATION_PORT: '5432'
      REDIS_URL: ${COMPOSE_REDIS_URL}
      DB_RELAY_PASSWORD: ''
      # Migrate không mở pool auth.
      DB_AUTH_PASSWORD: ''
    # Không có handler SIGTERM (PID 1 bỏ qua): cho statement đang chạy kết thúc trước SIGKILL.
    # Bằng DB_MIGRATION_STATEMENT_TIMEOUT_MS mặc định (600000 ms); đổi timeout đó thì đổi theo.
    # Migration không transactional (CREATE INDEX CONCURRENTLY) bị giết giữa chừng để lại index INVALID.
    stop_grace_period: 10m
    depends_on: { postgres: { condition: service_healthy } }
  api:
    <<: *app
    environment:
      DB_HOST: pgbouncer
      DB_PORT: '5432'
      # Pool auth_user đi qua PgBouncer (spike S2b).
      DB_AUTH_HOST: pgbouncer
      DB_AUTH_PORT: '5432'
      REDIS_URL: ${COMPOSE_REDIS_URL}
      DB_OWNER_PASSWORD: ''
      DB_RELAY_PASSWORD: ''
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: '3000'
      # Api không gửi thư (spec §9): chỉ worker có SMTP.
      SMTP_HOST: ''
    ports: ['127.0.0.1:${HTTP_PORT_HOST}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_started }
    # Distroless không có curl/wget: probe bằng chính node của image.
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
    # >= APP_SHUTDOWN_TIMEOUT_MS (28s) cộng biên, để hạn chót của app tới trước SIGKILL.
    stop_grace_period: 30s
  worker:
    <<: *app
    command: ['--import', './dist/instrumentation.js', 'dist/main.worker.js']
    environment:
      DB_HOST: pgbouncer
      DB_PORT: '5432'
      # Connection relay của worker đi thẳng Postgres (không qua PgBouncer).
      DB_RELAY_HOST: postgres
      DB_RELAY_PORT: '5432'
      DB_AUTH_HOST: pgbouncer
      DB_AUTH_PORT: '5432'
      REDIS_URL: ${COMPOSE_REDIS_URL}
      DB_OWNER_PASSWORD: ''
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: '3001'
      # Chỉ worker gửi thư (spec §9): service `mailpit` của stack này.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Bull Board read-only (spec §5.12, D9): chỉ worker này bật (một deployment). Cổng trong container cố định
      # 3002 để khớp port mapping; allowlist IP = subnet của network compose (khối `networks` cuối file).
      QUEUE_DASHBOARD_ENABLED: 'true'
      QUEUE_DASHBOARD_HOST: 0.0.0.0
      QUEUE_DASHBOARD_PORT: '3002'
      QUEUE_DASHBOARD_IP_ALLOWLIST: ${COMPOSE_SUBNET}
    ports: ['127.0.0.1:${QUEUE_DASHBOARD_PORT_HOST}:3002']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
    stop_grace_period: 30s
  otel-collector:
    image: ${IMAGE_OTEL_COLLECTOR}
    profiles: [observability]
    volumes:
      [
        './docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro',
      ]
    ports: ['127.0.0.1:${OTEL_PORT_HOST}:4318']
volumes:
  pgdata: {}
networks:
  default:
    ipam:
      # Subnet cố định: allowlist IP của Bull Board trong worker (spec §9).
      config: [{ subnet: '${COMPOSE_SUBNET}' }]
